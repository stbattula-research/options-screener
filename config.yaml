# options-screener configuration (v1)
# Strategy: cash-secured put selling on liquid underlyings.

watchlist:
  # Liquid, optionable stocks/ETFs. Edit freely.
  - SPY
  - QQQ
  - DIA
  - IWM
  - AAPL
  - MSFT
  - NVDA
  - AMD
  - TSLA
  - META
  - AMZN
  - GOOGL
  - JPM
  - XOM
  - NFLX

strategy:
  dte_min: 30          # minimum days to expiration for the short put
  dte_max: 45          # maximum days to expiration for the short put
  target_delta: -0.30  # cash-secured put target delta
  delta_tolerance: 0.07
  min_premium_pct: 0.01  # premium (mid) must be >= 1% of strike

liquidity:
  min_open_interest: 500
  min_volume: 100
  max_spread_pct: 0.10   # (ask - bid) / mid must be <= 10%

# v2: bull put spreads built over the CSP candidates (defined risk).
# Short leg = the ~30-delta CSP candidate; long leg = a cheaper put on the
# same expiry. Entry: long strike 2-6% of the short strike below it, passing
# the same liquidity filters, collecting at least 1/3 of the width in credit.
spread:
  enabled: true
  min_width_pct: 0.02
  max_width_pct: 0.06
  min_credit_fraction: 0.33

# Assumption: constant risk-free rate used for delta estimation.
# Documented openly; v2 can pull the live T-bill rate.
risk_free_rate: 0.04

# True IV rank (v2): each run snapshots the day's ~30-delta short-put IV into
# iv_history/<TICKER>.jsonl. Once a ticker has min_observations snapshots for
# the same DTE band, the report shows a true IV rank (with snapshot count);
# before that, the IV-vs-HV proxy is used and labeled as a proxy.
iv_rank:
  enabled: true
  history_dir: iv_history   # relative to where screener.py runs; git-ignored
  min_observations: 10      # daily snapshots needed before true rank prints

exits:
  profit_target_pct: 0.50   # close at 50% of max profit
  manage_dte: 21            # exit or roll at 21 DTE
  loss_manage_multiple: 2.0 # manage the trade if loss reaches 2x premium received

# Backtest engine (model-based: Black-Scholes premiums vs an IV proxy —
# NOT historical option chains, which no free source publishes).
backtest:
  entry_dte: 35           # DTE of each simulated short put
  entry_interval_days: 5  # attempt a new entry every N trading days (if flat)
  iv_window: 20           # trailing days for the realized-vol IV proxy
  iv_multiplier: 1.15     # IV proxy = realized vol x multiplier (variance risk premium)
  iv_fallback: 0.25       # used while trailing history is too short

# v5 exit-rule sensitivity sweep: re-runs the simulation over a grid of
# exit rules to check whether the exits: defaults above are robust or
# overfit. Grid values are intentionally coarse — this is a robustness
# check, not an optimizer. Run: python backtest.py --sweep --ticker SPY
backtest_sweep:
  profit_targets: [0.25, 0.50, 0.75]   # close at this fraction of max profit
  loss_multiples: [1.5, 2.0, 3.0]      # manage when cost-to-close hits this x premium
  manage_dtes: [14, 21]                # exit/roll at this DTE

# v7 skew-aware spread backtest: re-runs the bull-put-spread simulation once
# per skew value (same entries/strikes/exits, only leg pricing changes) to
# isolate the skew effect on net credit and on the live 1/3-width credit
# rule. Run: python backtest.py --spreads --ticker SPY
spread_backtest:
  skews: [0.0, 1.0, 2.0, 4.0]  # 0 = flat Black-Scholes; 2 ~= observed SPY put skew
  width_pct: 0.02               # narrow end of the live spread: 2-6% band

# v8 spread-width sweep: re-runs the spread simulation once per wing
# width at a FIXED skew, to measure where the live 1/3-width credit
# rule starts passing and what passing costs in total P&L. Run:
# python backtest.py --spread-widths --ticker SPY
spread_width_sweep:
  widths: [0.01, 0.02, 0.03, 0.04, 0.06]  # 1% below the live band, then the 2-6% band
  skew: 2.0  # ~= observed SPY put skew; the realistic case, not flat

# v3 alerting: email + webhook on NEW qualifying signals only (deduped via a
# local state file). Opt-in: enabled must be true AND the channel's env vars
# set. Run with `python screener.py --alerts` (or `--alerts-dry-run`).
# NO credentials here, ever — SMTP password / webhook URL / addresses come
# from environment variables only.
alerts:
  enabled: false
  state_dir: alert_state   # git-ignored; remembers which signals already fired
  rules:
    min_annualized_yield: 0.12  # CSP: fire when annualized yield >= this
    min_spread_roi: 0.30        # spread: fire when return on risk >= this
    min_iv_rank_true: 0.75      # fire when true IV rank >= this (rich-IV regime)
  email:
    enabled: false
    to: ""                  # env ALERT_EMAIL_TO
    from_: ""               # env ALERT_EMAIL_FROM (defaults to SMTP user)
    smtp_host: ""           # env ALERT_SMTP_HOST
    smtp_port: 587          # env ALERT_SMTP_PORT
    username: ""            # env ALERT_SMTP_USER; password ONLY env ALERT_SMTP_PASSWORD
  webhook:
    enabled: false
    url: ""                 # env ALERT_WEBHOOK_URL (Discord/Slack-style POST)

# Paper position tracking: the signal -> alert -> exit loop as a research
# simulation. Positions open automatically from NEWLY fired alerts
# (open_from_alerts) and are marked against each day's chain; exits use the
# SAME rules as the exits: section (50% of max profit / 21 DTE /
# 2x-premium loss). Paper only — this module never places orders and holds
# no broker credentials. Run with `python screener.py --alerts
# --paper-track` (alerts must be enabled for new positions to open).
paper:
  enabled: false
  state_dir: positions    # git-ignored; open + closed paper positions
  open_from_alerts: true  # auto-open a paper position per newly fired alert
  contracts: 1            # paper contracts per position (research sizing)
  max_open: 10            # cap on simultaneous paper positions
